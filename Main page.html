<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog UMKM Desa Jayamakmur</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="containerHeader">
            <h1>Katalog UMKM Desa Jayamakmur</h1>
            <p>Mendukung Produk Lokal, Memajukan Ekonomi Desa</p>
            
            <!-- Navigasi Menu Halaman -->
            <nav style="margin-top: 25px;">
                <a href="Main page.html" style="color: white; text-decoration: none; margin-right: 20px; font-weight: 600; border-bottom: 2px solid white; padding-bottom: 5px;">Katalog</a>
                <a href="tentang.html" style="color: rgba(255,255,255,0.8); text-decoration: none; font-weight: 600; padding-bottom: 5px; transition: color 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.8)'">Tentang Kami</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Area Pencarian dan Filter Kategori -->
        <section class="filter-search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nama UMKM...">
            </div>
            <div class="filter-box">
                <select id="categoryFilter">
                    <option value="">Semua Kategori</option>
                    <option value="Kuliner">Kuliner</option>
                    <option value="Kerajinan">Kerajinan</option>
                    <option value="Jasa">Jasa</option>
                </select>
            </div>
        </section>

        <!-- Wadah Murni untuk Kartu UMKM -->
        <section id="umkmContainer" class="umkm-grid">
            <p class="loading-text" style="grid-column: 1/-1; text-align: center; color: #888;">Memuat data UMKM...</p>
        </section>

        <!-- Kontrol Pagination Diletakkan di Luar Grid -->
        <div class="pagination-container" style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
            <button id="btn-prev" class="btn-page" disabled>&larr; Sebelum</button>
            <span id="page-info" style="margin: 0 15px; font-weight: 600; color: #1e5f74;">Halaman 1 dari 5</span>
            <button id="btn-next" class="btn-page">Sesudah &rarr;</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Tim KKN Universitas - Desa Jayamakmur. All Rights Reserved.</p>
    </footer>

    <!-- Script Utama Aplikasi -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
