<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir UMKM - JayamakmurHub</title>
    <link rel="stylesheet" href="assets/css/global.css?v=3">
    <link rel="stylesheet" href="assets/css/main.css?v=3">
    <script>
        // Proteksi Akses Admin
        if (localStorage.getItem('user_role') !== 'admin') {
            alert('⚠️ Akses ditolak! Halaman ini hanya untuk Admin Desa.');
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

    <!-- Modern Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <span class="logo-accent">Jayamakmur</span>Hub
            </a>
            <div class="navbar-links">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="Main page.html" class="nav-link">Katalog</a>
                <a href="tentang.html" class="nav-link">Tentang Kami</a>
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Ubah Tema Mode Gelap/Terang">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
        <div class="db-content-card" style="max-width: 750px; margin: 0 auto; padding: 40px; border-radius: 16px; background-color: var(--card-bg); border: 1px solid var(--border-color); box-shadow: var(--shadow-card);">
            <div class="db-content-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;">
                <h2 id="formTitle" style="font-size: 1.6rem; font-weight: 800; color: var(--text-dark); margin: 0;">Tambah UMKM Baru</h2>
            </div>

            <form id="umkmForm" class="form-db" style="display: flex; flex-direction: column; gap: 20px;">
                <input type="hidden" id="formUmkmId">
                
                <div class="form-db-row">
                    <div class="form-group">
                        <label for="formNama">Nama UMKM / Usaha</label>
                        <input type="text" id="formNama" placeholder="Contoh: Es Doger Mang Ulis" required>
                    </div>
                    <div class="form-group">
                        <label for="formKategori">Kategori</label>
                        <select id="formKategori">
                            <option value="Kuliner">Kuliner</option>
                            <option value="Kerajinan">Kerajinan</option>
                            <option value="Jasa">Jasa</option>
                        </select>
                    </div>
                </div>

                <div class="form-db-row">
                    <div class="form-group">
                        <label for="formWhatsapp">WhatsApp (Gunakan kode negara, ex: 62812...)</label>
                        <input type="text" id="formWhatsapp" placeholder="Contoh: 628123456789">
                    </div>
                    <div class="form-group">
                        <label for="formAlamat">Alamat Lengkap (Dusun / Jalan)</label>
                        <input type="text" id="formAlamat" placeholder="Contoh: Dusun Krajan RT 01 / RW 02">
                    </div>
                </div>

                <div class="form-group">
                    <label for="formDeskripsi">Deskripsi Detail Usaha</label>
                    <textarea id="formDeskripsi" style="min-height: 120px;" placeholder="Tuliskan cerita usaha, menu andalan, detail layanan secara menarik..."></textarea>
                </div>

                <div class="form-db-row">
                    <div class="form-group">
                        <label for="formGambar">Nama File Foto (di folder assets/images/)</label>
                        <input type="text" id="formGambar" placeholder="Contoh: Es Doger Mang Ulis.HEIC">
                    </div>
                    <div class="form-group">
                        <label for="formPassword">Kata Sandi (Untuk Login Pemilik)</label>
                        <input type="password" id="formPassword" placeholder="Default: owner123">
                    </div>
                </div>

                <div class="form-group">
                    <label for="formMapsUrl">Link Google Maps (Opsional)</label>
                    <input type="url" id="formMapsUrl" placeholder="https://maps.google.com/?q=...">
                </div>

                <div class="form-db-actions" style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 12px;">
                    <a href="admin.html" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Batal</a>
                    <button type="submit" class="btn-primary">Simpan Data</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Tim KKN Universitas - Desa Jayamakmur. All Rights Reserved.</p>
    </footer>

    <script type="module" src="Js/navbar.js?v=3"></script>
    <script type="module" src="Js/form_umkm_app.js?v=3"></script>
</body>
</html>
